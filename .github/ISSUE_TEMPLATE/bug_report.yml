name: Bug report
description: Report a reproducible problem with agyva.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include real credentials, tokens,
        vault files, keyring dumps or full personal email addresses.** Use a
        synthetic reproduction if you can (`scripts/demo-sandbox.sh`).

        Security problems belong in the private advisory form, linked from the
        issue chooser, not in a public issue.
  - type: input
    id: agyva-version
    attributes:
      label: agyva version
      description: Output of `agyva version`.
      placeholder: agyva 0.1.0 (commit ...)
    validations:
      required: true
  - type: input
    id: agy-version
    attributes:
      label: agy version
      description: The version agyva detects, and whether `--allow-untested` is needed.
      placeholder: agy 1.5.9
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install agyva?
      options:
        - Release tarball
        - cargo install from source
        - Built locally from a git checkout
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Credential backend
      description: See `agyva doctor` and `agyva config show` (`backend`).
      options:
        - auto
        - secret-service (GNOME Keyring, KeePassXC, KWallet bridge)
        - file
        - not sure
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Distribution and desktop environment, plus whether a session bus is available.
      placeholder: Arch Linux, KDE Plasma, Wayland, D-Bus session present
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. Mention if it happens in the synthetic sandbox too.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact command, exit code (`echo $?`) and the error text. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: |
        Output of `agyva doctor`, `agyva status`, and `AGYVA_LOG=debug` if
        relevant. Remove anything personal; never paste a credential.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have removed credentials, tokens, vault contents and personal data from this report.
          required: true
        - label: This is not a security vulnerability (those go to the private advisory form).
          required: true
        - label: I understand that agyva is an unofficial project and cannot change Google's policy or account decisions.
          required: true
