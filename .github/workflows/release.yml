name: release

# Push a tag like v0.1.0 to build release binaries and checksums for
# Linux (glibc), macOS (x86_64 + aarch64), and Windows (x86_64 + aarch64).
# Artifacts are attached to a DRAFT release; review and publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The workflow is inert on forks; releases are only built from the main repo.
    if: github.repository == '0x1d1e/agyva'
    name: release (${{ matrix.target }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            toolchain: native
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            toolchain: linux-gnu-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            toolchain: native
          - target: aarch64-apple-darwin
            os: macos-latest
            toolchain: native
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            toolchain: native
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            toolchain: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux arm64 cross-compiler
        if: matrix.toolchain == 'linux-gnu-arm64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Build release artifacts
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: scripts/release.sh --target "${{ matrix.target }}"
      - name: Verify checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: agyva-${{ matrix.target }}
          path: |
            dist/agyva-*
            dist/SHA256SUMS

  publish:
    if: github.repository == '0x1d1e/agyva'
    name: publish draft release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: agyva-*
          path: dist-in
      - name: Combine and verify checksums
        run: |
          mkdir -p dist
          cp dist-in/*/agyva-* dist/
          cat dist-in/*/SHA256SUMS > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/agyva-*
            dist/SHA256SUMS
