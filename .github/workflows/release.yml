name: release

# Push a tag like v0.1.0 to build the Linux x86_64 tarball and checksums.
# Artifacts are attached to a DRAFT release; review and publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    # The workflow is inert on forks; releases are only built from the main repo.
    if: github.repository == '0x1d1e/agyva'
    name: release (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: scripts/release.sh
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: agyva-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # Not supported yet (see ci.yml). Disabled on purpose.
  macos:
    if: false
    runs-on: macos-latest
    steps:
      - run: echo "macOS builds are not supported yet"

  windows:
    if: false
    runs-on: windows-latest
    steps:
      - run: echo "Windows builds are not supported yet"
