name: release

# Push a tag like v0.1.0 to build the Linux x86_64 and aarch64 release binaries, tarballs and checksums.
# Artifacts are attached to a DRAFT release; review and publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The workflow is inert on forks; releases are only built from the main repo.
    if: github.repository == '0x1d1e/agyva'
    name: release (${{ matrix.target }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compiler
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Build release artifacts
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: scripts/release.sh --target "${{ matrix.target }}"
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: agyva-${{ matrix.target }}
          path: |
            dist/agyva-*
            dist/SHA256SUMS

  publish:
    if: github.repository == '0x1d1e/agyva'
    name: publish draft release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: agyva-*
          path: dist-in
      - name: Combine and verify checksums
        run: |
          mkdir -p dist
          cp dist-in/*/agyva-* dist/
          cat dist-in/*/SHA256SUMS > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/agyva-*
            dist/SHA256SUMS

  # Not supported yet (see ci.yml). Disabled on purpose.
  macos:
    if: false
    runs-on: macos-latest
    steps:
      - run: echo "macOS builds are not supported yet"

  windows:
    if: false
    runs-on: windows-latest
    steps:
      - run: echo "Windows builds are not supported yet"
