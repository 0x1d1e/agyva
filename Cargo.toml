[package]
name = "agyva"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Manual account manager for Google's Antigravity CLI (agy)"
repository = "https://github.com/0x1d1e/agyva"
homepage = "https://github.com/0x1d1e/agyva"
readme = "README.md"
license = "MIT"
keywords = ["antigravity", "agy", "account-manager", "credentials", "cli"]
categories = ["command-line-utilities", "authentication"]
exclude = ["/target", "/dist", "/.github", "/deny.toml"]
publish = false

[lib]
name = "agyva"
path = "src/lib.rs"

[[bin]]
name = "agyva"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6"
fs4 = "1.1"
getrandom = "0.3"
hex = "0.4"
keyring-core = "1"
notify-rust = "4.17.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rpassword = "7"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
unicode-width = "0.2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "process", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
